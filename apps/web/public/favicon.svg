<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#14171F" />
      <stop offset="100%" stopColor="#080A0E" />
    </linearGradient>
    <linearGradient id="nGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF9100" />
      <stop offset="50%" stopColor="#FF5722" />
      <stop offset="100%" stopColor="#E64A19" />
    </linearGradient>
    <linearGradient id="nGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FF6D00" />
      <stop offset="100%" stopColor="#FFA000" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Canvas -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Outer Brand Ambient Glow -->
  <circle cx="64" cy="64" r="42" fill="#FF6D00" opacity="0.15" filter="url(#glow)" />
  
  <!-- 3D Ribbon Folded 'N' with Pin Icon -->
  <g filter="url(#glow)">
    <!-- Left vertical ribbon stem -->
    <path d="M34 26 C26 26 21 32 21 40 L21 88 C21 96 27 102 35 102 C43 102 45 96 45 88 L45 52 C45 42 43 26 34 26 Z" fill="url(#nGrad1)" />
    
    <!-- Diagonal Fold Cross Ribbon -->
    <path d="M23 44 C27 34 38 28 47 38 L84 86 C89 93 94 99 101 92 C106 86 104 77 98 70 L58 24 C52 17 40 18 31 28 Z" fill="url(#nGrad2)" opacity="0.95" />
    
    <!-- Right Upright Pin Stem -->
    <path d="M75 42 C75 30 84 20 96 20 C108 20 117 30 117 42 C117 54 99 76 96 80 C93 76 75 54 75 42 Z" fill="url(#nGrad1)" />
    <!-- Pin Core Center Hole -->
    <circle cx="96" cy="40" r="7" fill="#0E121A" />
  </g>
</svg>
