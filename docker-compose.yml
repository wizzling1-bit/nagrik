version: '3.8'

services:
  # Web Application (Next.js App Router + Supabase-first client + Cloudflare R2)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: naagrik-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://sbcvvcqsmgihhzuifafq.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-https://pub-421d616c2d3b4a94a05ad9bcbcb00380.r2.dev}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}

  # Legacy API Service (Retained for backward compatibility / adapter fallback)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: naagrik-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:-naagrik_super_secure_jwt_secret_key_2026}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-nagrik-media}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL:-https://pub-421d616c2d3b4a94a05ad9bcbcb00380.r2.dev}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
